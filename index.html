<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COLONY — field log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#14110d; --chamber:#1e1a14;
    --line:rgba(230,200,150,0.12); --line-2:rgba(230,200,150,0.22);
    --bone:#e9e0cf; --muted:#9a8f78; --faint:#6f6754;
    --grain:#e0a85a; --grain-deep:#b9772f; --bridge:#4fa890;
    --sans:"Space Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--void); color:var(--bone); font-family:var(--sans); line-height:1.5; padding:48px 20px 80px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.32em;text-transform:uppercase;color:var(--grain);margin:0 0 14px}
  h1{font-weight:600;font-size:34px;letter-spacing:0.02em;margin:0 0 6px}
  .sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0.2em;text-transform:uppercase;margin:0 0 16px}
  .lede{color:var(--muted);font-size:15px;max-width:54ch;margin:0 0 4px}
  .lede b{color:var(--grain);font-weight:400}
  .tally{font-family:var(--mono);font-size:12px;color:var(--faint);margin:14px 0 34px;border-top:1px solid var(--line);padding-top:14px}
  .tally b{color:var(--grain);font-weight:500}
  details{border:1px solid var(--line);border-radius:12px;background:var(--chamber);margin:0 0 12px;overflow:hidden}
  details[open]{border-color:var(--line-2)}
  summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:14px}
  summary::-webkit-details-marker{display:none}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--grain);flex:none;opacity:.9}
  .head{flex:1;min-width:0}
  .name{font-size:17px;font-weight:500}
  .desc{color:var(--muted);font-size:12.5px;margin-top:2px}
  .g{font-family:var(--mono);font-size:12px;color:var(--grain);flex:none;width:54px;text-align:right}
  .chev{flex:none;color:var(--faint);transition:transform .25s ease;font-family:var(--mono);font-size:13px}
  details[open] .chev{transform:rotate(90deg)}
  .bar{height:4px;border-radius:3px;background:rgba(230,200,150,0.08);margin:0 18px 0 33px;position:relative}
  .bar > i{position:absolute;inset:0;border-radius:3px;background:repeating-linear-gradient(90deg,var(--grain-deep) 0 2px,transparent 2px 5px),var(--grain);opacity:.9}
  .subs{padding:8px 18px 18px 33px}
  .item{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .ibody{flex:1;min-width:0}
  .item .sname{font-size:14.5px;font-weight:500;color:var(--bone);line-height:1.4;letter-spacing:0;text-transform:none}
  .item .sdetail{font-size:13px;color:var(--muted);line-height:1.55;margin-top:3px;letter-spacing:0;text-transform:none}
  .smeta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:2px}
  .smeta .sg{font-family:var(--mono);font-size:11.5px;color:var(--faint);text-align:right}
  .sbar{width:60px;height:3px;border-radius:2px;background:rgba(230,200,150,0.08);overflow:hidden}
  .sbar > i{display:block;height:100%;border-radius:2px}
  .bridge .dot{background:var(--bridge)}
  .foot{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:30px;text-align:center;letter-spacing:0.05em}
  @media (prefers-reduced-motion: no-preference){
    .wrap{animation:rise .5s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script>
  // Render the page from COLONY_DATA. All totals + bar widths are computed
  // here, so data.js only ever holds raw shard numbers.
  (function () {
    var d = COLONY_DATA;
    var esc = function (s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    };
    var clamp = function (n) { return Math.max(0, Math.min(100, n)); };
    var clamp01 = function (x) { return Math.max(0, Math.min(1, x)); };
    var lerp = function (a, b, t) { return Math.round(a + (b - a) * t); };
    // depth heat ramp: faint brown (shallow) -> amber -> bright gold (deep)
    var heat = function (t) {
      var c0 = [111, 103, 84], c1 = [224, 168, 90], c2 = [255, 216, 138], a, b, u;
      if (t < 0.5) { a = c0; b = c1; u = t / 0.5; } else { a = c1; b = c2; u = (t - 0.5) / 0.5; }
      return "rgb(" + lerp(a[0], b[0], u) + "," + lerp(a[1], b[1], u) + "," + lerp(a[2], b[2], u) + ")";
    };

    var chambers = d.chambers || [];
    var total = 0, maxItem = 0, maxChamber = 0;
    chambers.forEach(function (c) {
      c._total = (c.items || []).reduce(function (a, it) { return a + (it.shards || 0); }, 0);
      total += c._total;
      if (c._total > maxChamber) maxChamber = c._total;
      (c.items || []).forEach(function (it) { if ((it.shards || 0) > maxItem) maxItem = it.shards || 0; });
    });
    var itemScale = Math.max(12, maxItem); // deepest item = hot end of the ramp

    var html = "";
    html += '<p class="eyebrow">' + esc(d.eyebrow) + "</p>";
    html += "<h1>" + esc(d.title) + "</h1>";
    html += '<p class="sub">' + esc(d.sub) + "</p>";
    html += '<p class="lede">' + (d.lede || "") + "</p>"; // lede allows inline HTML on purpose
    html += '<p class="tally"><b>' + total + " ▽</b> carried so far · across "
          + chambers.length + " chambers" + (d.note ? " · " + esc(d.note) : "") + "</p>";

    chambers.forEach(function (c) {
      var dotClass = c.bridge ? "dot" : "dot";
      var openAttr = c.open ? " open" : "";
      var bridgeClass = c.bridge ? " bridge" : "";
      html += "<details" + openAttr + bridgeClass + ">";
      html += '<summary><span class="' + dotClass + '"></span>'
            + '<span class="head"><div class="name">' + esc(c.name) + "</div>"
            + '<div class="desc">' + esc(c.desc) + "</div></span>"
            + '<span class="g" style="color:' + heat(maxChamber ? c._total / maxChamber : 0) + '">'
            + c._total + ' ▽</span><span class="chev">›</span></summary>';
      html += '<div class="bar"><i style="width:' + clamp(c._total) + '%"></i></div>';
      html += '<div class="subs">';
      (c.items || []).forEach(function (it) {
        // Split "Label — detail" into a bold label + a muted detail line (first dash only).
        var m = String(it.name).match(/^([\s\S]*?)\s+[—–]\s+([\s\S]*)$/);
        var label = esc(m ? m[1] : it.name);
        var detail = m ? esc(m[2]) : "";
        var s = it.shards || 0;
        var t = clamp01(s / itemScale);   // depth, 0..1
        var col = heat(t);
        var w = Math.max(6, Math.round(t * 100)); // min nub so shallow items still read
        html += '<div class="item"><div class="ibody">'
              + '<div class="sname">' + label + "</div>"
              + (detail ? '<div class="sdetail">' + detail + "</div>" : "")
              + '</div><div class="smeta">'
              + '<span class="sg" style="color:' + col + '">' + s + "</span>"
              + '<span class="sbar"><i style="width:' + w + '%;background:' + col + '"></i></span>'
              + "</div></div>";
      });
      html += "</div></details>";
    });

    html += '<p class="foot">' + esc(d.foot) + "</p>";
    document.getElementById("app").innerHTML = html;
    document.title = d.title + " — " + d.eyebrow;
  })();
</script>
</body>
</html>
